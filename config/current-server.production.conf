# mdl_ingestd production profile for the current 2-socket AMD EPYC 9534 host.
# Syntax is one long option per line. Only full-line comments are supported.
# Relative paths are resolved from the mdl_ingestd working directory.

# Run identity and input. Use from-open only when sequence coverage genuinely
# starts at 1; use partial for a mid-session start or restart.
--mode ${L2FLOW_START_MODE}
--trade-date ${L2FLOW_TRADE_DATE}
--catalog ${L2FLOW_CATALOG}
--operation-mode live
# This deployment is Tick-only. Snapshot decoder/ring options below retain the
# fixed empty infrastructure but do not add Snapshot SDK subscriptions.
--stream-config config/live-ticks.streams.conf
--sdk-library /home/sunc/L2Flow/MDL/libmdl_api.so
--server 127.0.0.1:9112
--user ${L2FLOW_MDL_USER}

# NUMA 0 owns the active market-data NIC and ingest shared-memory allocation.
# Decoder threads 0..19 are pinned to physical CPUs 8..27. Other ingest,
# owner/Event/KLine calculation, SDK, and writer threads may use the remaining
# NUMA-0 physical CPUs and SMT siblings. CPUs 0..7 remain reserved for the
# operating system, IRQ handling, and the market-data NIC.
--process-cpus 8-63,128-191
--memory-node 0
--first-decoder-cpu 8
--tick-lanes 16
--snapshot-lanes 4
--instrument-workers 32
--sdk-work-threads 1
--sdk-ready-timeout-seconds 30

# SequenceRecovery policy. These waits are deployment policy, not exchange or
# MDL protocol constants; keep them under measurement during qualification.
--reorder-entries-per-channel 262144
--maximum-reorder-span 262144
--partial-initial-hold-ns 200000
--partial-gap-wait-ns 500000
--from-open-gap-wait-ns 500000

# Volatile Arrow hot path. With 32 owners these rings preallocate about 17.13
# GiB of payload capacity in /dev/shm, plus metadata and alignment overhead.
--arrow-ring-dir /dev/shm/l2flow/arrow
--arrow-feed-epoch ${L2FLOW_RAW_FEED_EPOCH}
--arrow-descriptors 1024
--arrow-segments 1088
--arrow-tick-segment-bytes 262144
--arrow-snapshot-segment-bytes 262144
--arrow-diagnostic-segment-bytes 131072
--arrow-max-consumers 16
--arrow-tick-batch-rows 256
--arrow-snapshot-batch-rows 16
--arrow-diagnostic-batch-rows 64
--arrow-batch-max-delay-ns 1000000
--arrow-heartbeat-interval-ns 1000000000

# Durable raw ClickHouse path. Production DDL is externally managed, so table
# auto-creation is disabled. This profile targets the local single-node HTTP
# endpoint and therefore uses insert quorum 0.
--clickhouse-url http://127.0.0.1:8123
--clickhouse-database l2flow
--clickhouse-user ${L2FLOW_CLICKHOUSE_USER}
--clickhouse-password-env L2FLOW_CLICKHOUSE_PASSWORD
--clickhouse-no-proxy *
--clickhouse-feed-epoch ${L2FLOW_RAW_FEED_EPOCH}
--clickhouse-source-instance-id ${L2FLOW_SOURCE_INSTANCE_HEX32}
--clickhouse-writers 4
--clickhouse-tick-batch-rows 16384
--clickhouse-tick-batch-bytes 16777216
--clickhouse-tick-batch-max-delay-ns 200000000
--clickhouse-snapshot-batch-rows 256
--clickhouse-snapshot-batch-bytes 16777216
--clickhouse-snapshot-batch-max-delay-ns 20000000
--clickhouse-queue-batches-per-lane 32
--clickhouse-connect-timeout-ms 2000
--clickhouse-request-timeout-ms 10000
--clickhouse-maximum-retry-ms 5000
--clickhouse-shutdown-timeout-ms 30000
--clickhouse-insert-quorum 0
--clickhouse-no-auto-create

# Shared process-lifetime accepted-fact spill. The 600M global cap covers the
# observed 474,485,838-fact day with 26.45% headroom. At the current 344-byte
# wire record this reserves a logical upper bound of about 192 GiB on disk.
# Dense pages need about 8.94 GiB for 600M slots; the separate 262,144-page
# guard caps page payload at 16 GiB because sparse channel sequences need more
# pages. Place this file on storage isolated from ClickHouse merge I/O.
--fact-journal-path ${L2FLOW_FACT_JOURNAL_PATH}
--fact-journal-hot-cache 262144
--fact-journal-maximum-records 600000000
--fact-journal-maximum-directory-pages 262144

# Event projection. Calculation remains owner-local and therefore runs across
# the 32 owner drain threads; eight independent sink lanes parallelize INSERTs.
--event-enable
--event-revision-epoch ${L2FLOW_EVENT_REVISION_EPOCH}
--event-calculation-run-id ${L2FLOW_EVENT_RUN_HEX32}
--event-logic-version 1
--event-micro-batch-rows 512
--event-micro-batch-max-delay-ns 50000000
--event-persistence-group-max-batches 1024
--event-persistence-group-max-rows 16384
--event-persistence-group-max-bytes 16777216
--event-persistence-group-max-delay-ns 500000000
--event-insert-request-max-rows 4096
--event-insert-request-max-bytes 4194304
--event-physical-group-max-batches 256
--event-physical-group-max-delay-ns 50000000
--event-writer-lanes 8
--event-queue-revision-batches 8192
--event-queue-revision-rows 4194304
--event-maximum-carry-orders 2097152
--event-maximum-order-history-bytes 4294967296
--event-maximum-hot-facts 16777216
--event-maximum-hot-fact-bytes 4294967296
--event-maximum-cached-events 16777216
--event-maximum-pending-commits 1024
--event-maximum-pending-revision-bytes 268435456
--event-maximum-repair-bytes 536870912
--event-maximum-end-candidates 2097152
--event-maximum-end-projected-rows 2097153
--event-maximum-end-staging-bytes 2147483648
--event-end-slice-max-candidates 2048
--event-end-slice-max-cpu-ns 500000
--event-repair-slice-max-order-uses 4096
--event-repair-slice-max-cpu-ns 500000
--event-phase-slice-max-nodes 4096
--event-phase-slice-max-bytes 4194304
--event-phase-slice-max-cpu-ns 500000
--event-maximum-pending-channel-seals 4096
--event-eviction-slice-max-nodes 4096
--event-eviction-slice-max-bytes 4194304

# Exchange-time KLine projection. The interval is an integer in [1, 86400].
# Add another --kline-interval-seconds on the CLI to calculate more intervals;
# repeatable options append, then startup sorts and deduplicates them.
--kline-enable
--kline-interval-seconds ${L2FLOW_KLINE_INTERVAL_SECONDS}
--kline-revision-epoch ${L2FLOW_KLINE_REVISION_EPOCH}
--kline-calculation-run-id ${L2FLOW_KLINE_RUN_HEX32}
--kline-logic-version 1
--kline-micro-batch-rows 256
--kline-micro-batch-max-delay-ns 50000000
--kline-insert-request-max-rows 4096
--kline-insert-request-max-bytes 4194304
--kline-physical-group-max-batches 256
--kline-physical-group-max-delay-ns 100000000
--kline-writer-lanes 8
--kline-queue-revision-batches 8192
--kline-queue-revision-rows 4194304
--kline-maximum-bars 4194304
--kline-maximum-pending-commits 1024
