# Local, unprivileged Redis instance for development and benchmarking.
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize yes
supervised no
pidfile ../run/redis.pid
loglevel notice
logfile ../log/redis.log
always-show-logo no

databases 16

# This PoC is intentionally memory-only.
save ""
appendonly no
dir data
dbfilename dump.rdb

# Fail fast rather than evicting market data implicitly. Add maxmemory and an
# explicit policy here when testing memory-pressure behavior.
maxmemory 0
maxmemory-policy noeviction
